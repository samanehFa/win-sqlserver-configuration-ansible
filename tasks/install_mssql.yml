---

- name: Determine if the default instance exists.
  ansible.windows.win_service:
    name: 'MSSQLSERVER'
  register: service_info

- name: Initialize disks
  include_tasks: "../tasks/playbook_diskPrep.yml"

- name: Create temp folder on target
  win_file:
    path: 'C:\temp'
    state: directory
  when:
    - not service_info.exists

- name: Create Temp directory
  win_file:
    path: 'C:\Temp'
    state: directory

# Determine if the default instance exists
- name: Determine if the default instance exists
  win_service:
    name: 'MSSQLSERVER'
  register: service_info

# Set Windows power plan to high performance
- name: Set Windows power plan to high performance
  win_power_plan:
    name: high performance
  when:
    - not service_info.exists

# Copy ISO to target
- name: Copy ISO to target
  win_copy:
    src: "{{ sql_iso_filename }}"
    dest: ""
  when:
    - not service_info.exists

# Copy the configuration.ini file to target
- name: Copy the configuration.ini file to target
  template:
    src: templates/configuration.ini.j2
    dest: C:\Temp\configuration.ini 
  when:
    - not service_info.exists

# Mount the SQL Server ISO
- name: Mount ISO
  win_disk_image:
    image_path: ''
    state: present
  register: disk_image_out
  when:
    - not service_info.exists

# Set SQL Server SA password
- name: SQL Server SA password
  set_fact:
    sa_password_switch: "{{ '/SAPWD={{ rl_mssql_sapwd }}' }}"
  when:
    - not service_info.exists

- name: Clean TempDB directory
  win_file:
    path: 'D:\\TempDB'
    state: absent
  when: service_info.exists == false

- name: Recreate TempDB directory
  win_file:
    path: 'D:\\TempDB'
    state: directory
  when: service_info.exists == false


# Install Default instance
- name: Install Default instance
  win_command:
    cmd: '{{ disk_image_out.mount_paths[0] }}setup.exe /ConfigurationFile=C:\temp\Configuration.ini {{ sa_password_switch }} /IAcceptSQLServerLicenseTerms'
  when:
    - not service_info.exists

# Unmount ISO after installation
- name: Unmount ISO
  win_disk_image:
    image_path: ""
    state: absent
  when:
    - not service_info.exists

- name: Set Full-Text Upgrade Option to 'Import'
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "EXEC sp_fulltext_service 'upgrade_option', 1;"


#Copy the SSMS installer to the target server
- name: Copy SSMS installer to destination server
  ansible.windows.win_copy:
    src: "{{ ssms_installer }}"
    dest: C:\Temp\{{ ssms_installer }}

- name: Check if SSMS is installed
  win_stat:
    path: C:\Program Files (x86)\Microsoft SQL Server Management Studio 20
  register: ssms_installed

- name: Install SQL Server Management Studio (SSMS)
  win_command:
    cmd: C:\Temp\{{ ssms_installer }} /install /quiet /norestart /log C:\Temp\ssms_install.log
  when: not ssms_installed.stat.exists

- name: Grant priviledge to SQL Server service account
  win_shell: |
    secedit /export /cfg C:\Temp\secpol.cfg
    (Get-Content -Path C:\Temp\secpol.cfg) -replace 'SeManageVolumePrivilege =', 'SeManageVolumePrivilege = {{ sql_service_account }}' | Set-Content -Path C:\Temp\secpol.cfg
    secedit /configure /db secedit.sdb /cfg C:\Temp\secpol.cfg /areas USER_RIGHTS
    Remove-Item C:\Temp\secpol.cfg
  args:
    creates: C:\Temp\secpol.cfg

- name: Grant Full Control to SQLSERVERAGENT on Log folder
  win_acl:
    path: "D:\\<SQL_PATH>\\MSSQL\\Log"
    user: "NT SERVICE\\SQLSERVERAGENT"
    rights: FullControl
    type: allow
    inheritance: true
    propagation: InheritOnly

- name: Enable TCP/IP for MSSQLSERVER via Registry
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQLServer\SuperSocketNetLib\Tcp\IPAll
    name: Enabled
    data: 1
    type: dword
    state: present
  when: service_info.exists

- name: Enable Force Encryption for MSSQLSERVER
  win_shell: |
    Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQLServer\SuperSocketNetLib" -Name "ForceEncryption" -Value 0
  register: disable_encryption

- name: Stop SQL Server Agent
  ansible.windows.win_service:
    name: SQLSERVERAGENT
    state: stopped

- name: Stop SQL Server Service
  win_service:
    name: MSSQLSERVER
    state: stopped

- name: Start SQL Server Service
  win_service:
    name: MSSQLSERVER
    state: started

- name: Start SQL Server Agent
  ansible.windows.win_service:
    name: SQLSERVERAGENT
    state: started

- name: Verify Service State
  ansible.windows.win_service_info:
    name: MSSQLSERVER
  register: sql_service_info

- name: Debug Service State
  debug:
    msg: "SQL Server service is {{ sql_service_info.services[0].state }}"

- name: Enable advanced options in SQL Server
  win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE;"

- name: Set SQL Server Maximum Memory to 80% of physical memory (leave 2GB for OS)
  ansible.windows.win_shell: |
    $totalMem = (Get-CimInstance -ClassName Win32_ComputerSystem).TotalPhysicalMemory / 1MB
    $eightyPercent = [math]::Floor($totalMem * 0.8)
    $leaveTwoGB = [math]::Floor($totalMem - 2048)
    $maxSqlMem = [math]::Min($eightyPercent, $leaveTwoGB)
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'max server memory (MB)', $maxSqlMem; RECONFIGURE;"
 
- name: Set LoginAuditLevel to 3 (both failed and successful logins)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQLSERVER\MSSQLServer
    name: LoginAuditLevel
    data: 3
    type: dword

- name: Restart SQL Server service to apply changes
  ansible.windows.win_service:
    name: MSSQLSERVER
    state: restarted
    force_dependent_services: true

- name: Verify LoginAuditLevel from registry
  ansible.windows.win_shell: |
    reg query "HKLM\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQLSERVER\MSSQLServer" /v LoginAuditLevel
  register: login_audit_check

- debug:
    var: login_audit_check.stdout


- name: Set default index fill factor to 90%
  win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "EXEC sp_configure 'fill factor (%)', 90; RECONFIGURE;"
  args:
    executable: cmd
  register: set_fill_factor

- name: Create index on backupset table
  win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    USE msdb;
    IF NOT EXISTS (SELECT * FROM sys.indexes WHERE name='IX_BackupSet_BackupDate_DBName')
    BEGIN
      CREATE INDEX IX_BackupSet_BackupDate_DBName
      ON backupset (backup_start_date, database_name);
    END
    "
  register: index_backupset_result

- name: Create index on backupmediafamily table
  win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    USE msdb;
    IF NOT EXISTS (SELECT * FROM sys.indexes WHERE name='IX_BackupMediaFamily_PhysicalDevice')
    BEGIN
      CREATE INDEX IX_BackupMediaFamily_PhysicalDevice
      ON backupmediafamily (physical_device_name);
    END
    "
  register: index_backupmediafamily_result

- name: Debug index creation results
  debug:
    msg:
      - "Backupset Index: {{ index_backupset_result.stdout }}"
      - "BackupMediaFamily Index: {{ index_backupmediafamily_result.stdout }}"


#Configuring Database Mail
- name: Enable Database Mail
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC sp_configure 'show advanced options', 1;
    RECONFIGURE;
    EXEC sp_configure 'Database Mail XPs', 1;
    RECONFIGURE;"

- name: Create Database Mail Profile
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sysmail_add_profile_sp
    @profile_name = 'SMTP Account',
    @description = 'Mail profile for notifications';"

- name: Create Database Mail Account
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sysmail_add_account_sp
        @account_name = 'SMTP Account',
        @description = 'SMTP Mail Account',
        @email_address = '{{ notification_email }}',
        @mailserver_name = '{{ smtp_server }}',
        @port = 25,
        @enable_ssl = 1;"

- name: Link Account to Profile
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sysmail_add_profileaccount_sp
    @profile_name = 'SMTP Account',
    @account_name = 'SMTP Account',
    @sequence_number = 1;"

- name: Set Profile as Public and Default
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sysmail_add_principalprofile_sp
    @profile_name = 'SMTP Account',
    @principal_name = 'public',
    @is_default = 1;"

- name: Send Test Email
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sp_send_dbmail
    @profile_name = 'SMTP Account',
    @recipients = '{{ test_recipient_email }}',
    @subject = 'Test Email',
    @body = 'This is a test email sent via Ansible setup.';"


#SQL Server Agent Configuration
- name: Create SQL Agent Operator - onalerts-low
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sp_add_operator
    @name = '{{ alert_operator_email }}',
    @enabled = 1,
    @email_address = '{{ alert_operator_email }}';"

- name: Create SQL Agent Operator - servicecheck
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sp_add_operator
    @name = 'servicecheck@onmail.oevermann.de',
    @enabled = 1,
    @email_address = 'servicecheck@onmail.oevermann.de';"

- name: Enable SQL Server Agent Mail Profile
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sp_set_sqlagent_properties
    @email_save_in_sent_folder = 1,
    @databasemail_profile = 'SMTP Account';"

