#service settings
- name: Set MSSQLSERVER service startup to Delayed-Auto
  ansible.windows.win_shell: |
    cmd /c "sc.exe config MSSQLSERVER start= delayed-auto"

- name: Configure MSSQLSERVER service failure actions
  ansible.windows.win_shell: |
    cmd /c "sc.exe failure MSSQLSERVER actions= restart/60000/restart/60000///180000 reset= 86400"

- name: Set SQLSERVERAGENT service startup to Delayed-Auto
  ansible.windows.win_shell: |
    cmd /c "sc.exe config SQLSERVERAGENT start= delayed-auto"

- name: Configure SQLSERVERAGENT service failure actions
  ansible.windows.win_shell: |
    cmd /c "sc.exe failure SQLSERVERAGENT actions= restart/60000/restart/60000///180000 reset= 86400"


#optional configuration replication
- name: Set Maximum Replication Data Size to Maximum
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC sp_configure 'max text repl size', 2147483647;
    RECONFIGURE;"

- name: Check Current Max Text Replication Size
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "EXEC sp_configure"

#Autogrow
- name: Ensure SQLServerSQLAgentUsers group exists
  ansible.windows.win_group:
    name: SQLServerSQLAgentUsers
    state: present

- name: Ensure SQLServerSQLServerUsers group exists
  ansible.windows.win_group:
    name: SQLServerSQLServerUsers
    state: present


- name: Verify Local Groups Exist
  ansible.windows.win_command: net localgroup

- name: Verify User Rights Assignment for SQL Groups
  ansible.windows.win_shell: |
    secedit /export /cfg C:\secpol.cfg
    findstr "Perform volume maintenance tasks" C:\secpol.cfg
  register: secedit_output
  failed_when: false

- name: Set SQL Server default data location
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQLServer
    name: DefaultData
    data: 'D:\MSSQL16.MSSQLSERVER\MSSQL\DATA'
    type: string

- name: Set SQL Server default log location
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQLServer
    name: DefaultLog
    data: 'D:\MSSQL16.MSSQLSERVER\MSSQL\DATA'
    type: string

# Configure file system permissions for SQL users
- name: Grant Read & Execute Permissions on Data Partition (D:\)
  ansible.windows.win_acl:
    path: D:\
    user: ""  
    rights: ReadAndExecute
    type: allow
    state: present

- name: Ensure SQL Backup directory exists
  ansible.windows.win_file:
    path: D:\
    state: directory

- name: Grant Write Permissions on SQL Backup Directory (D:\MSSQL\Backup\)
  ansible.windows.win_acl:
    path: D:\MSSQL\Backup\
    user: "" 
    rights: Write
    type: allow
    state: present

#Setting up SQL Agent jobs for SQL Server maintenance
- name: Download Ola Hallengren's SQL Server Maintenance Solution
  ansible.windows.win_get_url:
    url: https://ola.hallengren.com/scripts/MaintenanceSolution.sql
    dest: path\

- name: Execute MaintenanceSolution.sql to create maintenance jobs
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -i C:\Temp\MaintenanceSolution.sql

- name: Enable and Schedule SQL Agent Jobs
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    -- Enable jobs
    EXEC msdb.dbo.sp_update_job @job_name = 'CommandLog Cleanup', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'DatabaseIntegrityCheck - SYSTEM_DATABASES', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'DatabaseIntegrityCheck - USER_DATABASES', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'IndexOptimize - USER_DATABASES', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'Output File Cleanup', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'sp_delete_backuphistory', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'sp_purge_jobhistory', @enabled = 1;
    EXEC msdb.dbo.sp_update_job @job_name = 'syspolicy_purge_history', @enabled = 1;

    -- Weekly schedule: CommandLog Cleanup
    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'CommandLog Cleanup Schedule',
      @freq_type = 8,
      @freq_interval = 1,               -- Sunday
      @freq_recurrence_factor = 1,     -- Every week
      @active_start_time = 40000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'CommandLog Cleanup', @schedule_name = 'CommandLog Cleanup Schedule';

    -- Daily schedules
    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'DatabaseIntegrityCheck SYSTEM Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 220000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'DatabaseIntegrityCheck - SYSTEM_DATABASES', @schedule_name = 'DatabaseIntegrityCheck SYSTEM Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'DatabaseIntegrityCheck USER Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 230000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'DatabaseIntegrityCheck - USER_DATABASES', @schedule_name = 'DatabaseIntegrityCheck USER Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'IndexOptimize Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 20000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'IndexOptimize - USER_DATABASES', @schedule_name = 'IndexOptimize Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'Output File Cleanup Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 10000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'Output File Cleanup', @schedule_name = 'Output File Cleanup Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'sp_delete_backuphistory Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 130000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'sp_delete_backuphistory', @schedule_name = 'sp_delete_backuphistory Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'sp_purge_jobhistory Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 50000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'sp_purge_jobhistory', @schedule_name = 'sp_purge_jobhistory Daily';

    EXEC msdb.dbo.sp_add_schedule 
      @schedule_name = 'syspolicy_purge_history Daily',
      @freq_type = 4,
      @freq_interval = 1,
      @active_start_time = 230000;
    EXEC msdb.dbo.sp_attach_schedule @job_name = 'syspolicy_purge_history', @schedule_name = 'syspolicy_purge_history Daily';
    "


- name: Verify SQL Agent Operator Exists
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    EXEC msdb.dbo.sp_add_operator
    @name = '',
    @enabled = 1,
    @email_address = '';"

- name: Cleanup Temp Files
  ansible.windows.win_file:
    path: path\
    state: absent

- name: Set up email notifications for SQL Agent jobs on failure
  ansible.windows.win_shell: |
    sqlcmd -S "{{ sql_instance }}" -U "{{ sql_username }}" -P "{{ sa_password }}" -Q "
    DECLARE @job_name NVARCHAR(128);
    DECLARE job_cursor CURSOR FOR
    SELECT name FROM msdb.dbo.sysjobs;

    OPEN job_cursor;
    FETCH NEXT FROM job_cursor INTO @job_name;

    WHILE @@FETCH_STATUS = 0
    BEGIN
        EXEC msdb.dbo.sp_update_job 
            @job_name = @job_name, 
            @notify_level_email = 2,  -- 2 = Notify on Failure
            @notify_email_operator_name = '';
        FETCH NEXT FROM job_cursor INTO @job_name;
    END

    CLOSE job_cursor;
    DEALLOCATE job_cursor;"
  register: sql_agent_notification_result

- name: Debug SQL Agent notification setup result
  debug:
    var: sql_agent_notification_result.stdout_lines
