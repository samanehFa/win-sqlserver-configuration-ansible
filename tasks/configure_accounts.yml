- name: Grant SQL Admins group full permissions in SQL Server
  win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -Q "CREATE LOGIN [{{ domain }}\\{{ sql_admin_group }}] FROM WINDOWS; ALTER SERVER ROLE sysadmin ADD MEMBER [{{ domain }}\\{{ sql_admin_group }}];"
  args:
    executable: cmd

- name: Grant SQL Admins group full permissions on SQL Server folders
  win_acl:
    path: "{{ item }}"
    user: "{{ domain }}\\{{ sql_admin_group }}"
    rights:
      - fullcontrol
    state: present
    propagate: yes
  with_items:
    - 'C:\Program Files\Microsoft SQL Server'
    - 'C:\Program Files (x86)\Microsoft SQL Server'

- name: Configure SQL Server service account
  win_service:
    name: MSSQLSERVER
    start_mode: Automatic
    username: "{{ domain }}\\{{ sql_service_user }}"
    password: "{{ sql_service_password }}"
  when: "{{ sql_service_user_exists }}"

- name: Configure SQL Agent service account
  win_service:
    name: SQLSERVERAGENT
    start_mode: Automatic
    username: "{{ domain }}\\{{ sql_agent_user }}"
    password: "{{ sql_agent_password }}"
  when: "{{ sql_agent_user_exists }}"

- name: Ensure SQL Server service account has read/write permissions on SQL folders
  win_acl:
    path: "{{ item }}"
    user: "{{ domain }}\\{{ sql_service_user }}"
    permissions: "ReadAndExecute, Write"
    state: present
  with_items:
    - "C:\\Program Files\\Microsoft SQL Server"
    - "D:\\SQLData"
    - "D:\\SQLLogs"

- name: Ensure SQL Agent service account has read/write permissions on SQL folders
  win_acl:
    path: "{{ item }}"
    user: "{{ domain }}\\{{ sql_agent_user }}"
    permissions: "ReadAndExecute, Write"
    state: present
  with_items:
    - "C:\\Program Files\\Microsoft SQL Server"

- name: Validate SQL Server service account
  win_shell: |
    Get-Service MSSQLSERVER | Select-Object -Property StartName
  register: sql_srv_account

- name: Validate SQL Agent service account
  win_shell: |
    Get-Service SQLSERVERAGENT | Select-Object -Property StartName
  register: sql_agt_account

- name: Debug service account configuration
  debug:
    msg:
      - "SQL Server service account: {{ sql_srv_account.stdout }}"
      - "SQL Agent service account: {{ sql_agt_account.stdout }}"
